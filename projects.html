        <main>
            
            <div class="hero-text">

            <!-- Game info panel (filled in by projects.js) -->

                <p id="panel-description"></p>

                <ul class="panel-details" id="panel-details"></ul>

                <a class="play-button" id="panel-link" href="#"></a>
